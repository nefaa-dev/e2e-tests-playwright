ui-smoke-preprod:
  stage: e2e-test
  tags:
    - kos-deep-pack-qa-runner
  allow_failure: false
  image: mcr.microsoft.com/playwright:v1.34.3-jammy
  variables:
    CI: true
    TESTMO_TOKEN: $TESTMO_TOKEN
    DEEPPACK_USER_NAME: $DEEPPACK_USER_NAME
    DEEPPACK_PASSWORD: $DEEPPACK_PASSWORD
    IS_HEADLESS: true
  needs: [ deploy-preprod, api-smoke]
  only:
    - master

  before_script:
    - apt-get clean
    - apt-get update
    - export RELEASE_NAME=$(eval "echo ${CI_COMMIT_REF_SLUG:0:15} | sed 's/-*$//'")
    - export WEB_URL=https://test-organization.beta.next.deeppack.ai
    - echo $WEB_URL


  script:

    - cd $CI_PROJECT_DIR/e2e-tests/ui-tests
    - npm ci
    - npx playwright install
    - npm run beforeAll
    - npm run smoke-test || TEST_FAILED=true
    - node ./src/helpers/htmlReportGenerator.js
    - npm install --cache .npm --prefer-offline --no-save @testmo/testmo-cli
    - npx testmo automation:resources:add-field --name git --type string --value $CI_COMMIT_SHORT_SHA --resources resources.json
    - npx testmo automation:resources:add-link --name build --url $CI_PIPELINE_URL --resources resources.json
    - npx testmo automation:run:submit --instance "https://instadeepltd.testmo.net/" --project-id 2 --name "Pre-prod:$RELEASE_NAME" --source "frontend" --resources resources.json --results $CI_PROJECT_DIR/e2e-tests/ui-tests/artifacts/test-results/cucumber-report.xml
    - if [ "$TEST_FAILED" = "true" ]; then exit 1; fi


  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

  artifacts:
    when: always
    reports:
      junit:
        - $CI_PROJECT_DIR/e2e-tests/ui-tests/artifacts/test-results/cucumber-report.xml
    paths:
        - $CI_PROJECT_DIR/e2e-tests/ui-tests/artifacts
        



